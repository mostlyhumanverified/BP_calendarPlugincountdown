<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Meeting Countdown Link — Settings</title>
    <style>
      body {
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        width: 340px;
        padding: 16px;
        color: #1f2430;
        background: #ffffff;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 4px;
      }
      p.hint {
        color: #5f6672;
        margin: 0 0 14px;
        font-size: 12px;
      }
      label {
        display: block;
        font-weight: 600;
        margin-bottom: 6px;
      }
      input[type="url"] {
        width: 100%;
        box-sizing: border-box;
        padding: 8px 10px;
        border: 1px solid #d3d7de;
        border-radius: 6px;
        font-size: 13px;
      }
      .row {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }
      button {
        flex: 1;
        padding: 8px 10px;
        border-radius: 6px;
        border: 1px solid transparent;
        font-size: 13px;
        cursor: pointer;
      }
      #save {
        background: #4f46e5;
        color: #fff;
      }
      #reset {
        background: #f1f2f6;
        color: #1f2430;
        border-color: #d3d7de;
      }
      #status {
        margin-top: 10px;
        font-size: 12px;
        min-height: 14px;
        color: #16a34a;
      }
    </style>
  </head>
  <body>
    <h1>⏳ Meeting Countdown Link</h1>
    <p class="hint">
      This is the countdown page the extension links to. Leave the default unless you're
      hosting your own copy of <code>countdown.html</code>.
    </p>
    <label for="baseUrl">Countdown page URL</label>
    <input id="baseUrl" type="url" spellcheck="false" placeholder="https://…/countdown.html" />
    <div class="row">
      <button id="save">Save</button>
      <button id="reset">Reset to default</button>
    </div>
    <div id="status"></div>
    <script src="config.js"></script>
    <script src="options.js"></script>
  </body>
</html>
