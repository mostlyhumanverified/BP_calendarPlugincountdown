<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Meeting Countdown</title>
<meta name="robots" content="noindex" />
<style>
  :root {
    --bg: #f5f6fb;
    --card-bg: #ffffff;
    --text: #1f2430;
    --muted: #666d7a;
    --accent: #4f46e5;
    --accent-soft: #eef0fd;
    --danger: #dc2626;
    --success: #16a34a;
    --border: #e4e6ee;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14151c;
      --card-bg: #1d1f29;
      --text: #edeef3;
      --muted: #9aa0ad;
      --accent: #8b85f7;
      --accent-soft: #262a44;
      --danger: #f87171;
      --success: #4ade80;
      --border: #2c2f3d;
    }
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Google Sans", Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 40px 32px;
    width: 100%;
    max-width: 440px;
    text-align: center;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
  }

  .eyebrow {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 8px;
  }

  h1 {
    font-size: 20px;
    margin: 0 0 24px;
    font-weight: 600;
    word-wrap: break-word;
  }

  .timer {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .timer[hidden] {
    display: none;
  }

  .unit {
    background: var(--accent-soft);
    border-radius: 12px;
    padding: 14px 10px;
    min-width: 68px;
  }

  .unit .value {
    font-size: 30px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--text);
    line-height: 1.1;
  }

  .unit .label {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-top: 4px;
  }

  .status {
    font-size: 14px;
    color: var(--muted);
  }

  .status.ended {
    color: var(--success);
    font-weight: 600;
    font-size: 18px;
  }

  .status.error {
    color: var(--danger);
    font-weight: 600;
  }

  .target-time {
    margin-top: 18px;
    font-size: 12px;
    color: var(--muted);
  }

  noscript {
    display: block;
    color: var(--danger);
    margin-top: 16px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">Meeting Countdown</div>
    <h1 id="title">Meeting</h1>

    <div id="timer" class="timer" hidden>
      <div class="unit"><div class="value" id="days">0</div><div class="label">Days</div></div>
      <div class="unit"><div class="value" id="hours">00</div><div class="label">Hours</div></div>
      <div class="unit"><div class="value" id="minutes">00</div><div class="label">Min</div></div>
      <div class="unit"><div class="value" id="seconds">00</div><div class="label">Sec</div></div>
    </div>

    <div id="status" class="status"></div>
    <div id="targetTime" class="target-time"></div>
  </div>

  <noscript>This page needs JavaScript enabled to show the live countdown.</noscript>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var toParam = params.get("to");
      var titleParam = params.get("title");

      var titleEl = document.getElementById("title");
      var timerEl = document.getElementById("timer");
      var statusEl = document.getElementById("status");
      var targetTimeEl = document.getElementById("targetTime");

      if (titleParam) {
        titleEl.textContent = titleParam;
      }

      if (!toParam) {
        statusEl.textContent = "No end time was provided in the link.";
        statusEl.className = "status error";
        return;
      }

      var target = new Date(toParam);
      if (isNaN(target.getTime())) {
        statusEl.textContent = "This countdown link has an invalid end time.";
        statusEl.className = "status error";
        return;
      }

      targetTimeEl.textContent =
        "Ends " +
        target.toLocaleString(undefined, {
          weekday: "short",
          year: "numeric",
          month: "short",
          day: "numeric",
          hour: "numeric",
          minute: "2-digit",
        });

      var daysEl = document.getElementById("days");
      var hoursEl = document.getElementById("hours");
      var minutesEl = document.getElementById("minutes");
      var secondsEl = document.getElementById("seconds");

      function pad(n) {
        return String(n).padStart(2, "0");
      }

      var intervalId = null;

      function tick() {
        var diff = target.getTime() - Date.now();

        if (diff <= 0) {
          clearInterval(intervalId);
          timerEl.hidden = true;
          statusEl.textContent = "🎉 This meeting has ended.";
          statusEl.className = "status ended";
          document.title = "Meeting ended";
          return;
        }

        timerEl.hidden = false;
        statusEl.textContent = "until this meeting ends";
        statusEl.className = "status";

        var totalSeconds = Math.floor(diff / 1000);
        var days = Math.floor(totalSeconds / 86400);
        var hours = Math.floor((totalSeconds % 86400) / 3600);
        var minutes = Math.floor((totalSeconds % 3600) / 60);
        var seconds = totalSeconds % 60;

        daysEl.textContent = days;
        hoursEl.textContent = pad(hours);
        minutesEl.textContent = pad(minutes);
        secondsEl.textContent = pad(seconds);

        document.title =
          (days > 0 ? days + "d " : "") + pad(hours) + ":" + pad(minutes) + ":" + pad(seconds) + " left";
      }

      tick();
      intervalId = setInterval(tick, 1000);
    })();
  </script>
</body>
</html>
